	/*creating a grain filter that fades at the edges, and blending it with base SVG*/
  <filter id='noiseFilter'>
	/*generate semi-random noise*/
    <feTurbulence 
      type='fractalNoise' 
      baseFrequency='0.5' 
      numOctaves='1' 
      stitchTiles='stitch'
	  result="NOISE"
	></feTurbulence>
	/*get image; BUT: feImage DOES NOT want to pull in a radial gradient as input, even if i render 
	it in an object in the SVG and hide behind other paths, to work around this, below 
	nests a separate SVG for the radial gradient, encoded in base64 */
	/*base 64 encoding of a white to black radial gradient (actually dark grey to light grey) */
	<feImage
  		href="data:image/svg+xml;base64,"
  		result="GRADIENT"/>
	/*below combines gradient with noise to get fading grain effect*/ 
	/* poss values for mode=""  normal; darken; multiply; color-burn; lighten; 
				screen; color-dodge; overlay ; soft-light; hard-light; 
				difference; exclusion; hue; saturation; color; luminosity */
	<feBlend
		in2="GRADIENT"
		in="NOISE"
		mode="multiply"
		result="FADENOISE" />
	<!-- <feComponentTransfer 
		in="SOFTENED_NOISE" result="CONTRASTNOISE">
		<feFuncR type="linear" slope="10" intercept="-3" />
		<feFuncG type="linear" slope="10" intercept="-3" />
		<feFuncB type="linear" slope="10" intercept="-3" />
  	</feComponentTransfer> -->
	<feComposite
		in2="SourceAlpha"
		in="FADENOISE"
		operator="in"
		result="CLIPNOISE" />
	/* previous was not enough to fully trim filters, finishes clipping alpha properly */
	<feComposite
		in2="#circleOutInFade"
		in="CLIPNOISE"
		operator="in"
		result="FADENOISE" />
	/*combines gradient/noise with main svg*/ 

  </filter>

