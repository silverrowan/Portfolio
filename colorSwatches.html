<input type="radio" name="page-theme" id="light-theme">
<input type="radio" name="page-theme" id="dark-theme" checked>
<input type="radio" name="page-theme" id="nature-theme">
<main>
    <div class="theme-menu">
        <input type="checkbox" id="theme-menu-trigger">
        <label class="theme-label button " for="light-theme"><i class="theme-label fa-solid fa-sun fa-sm"></i><p class="btn btn-primary m-2">light</p></label>
        <label class="theme-label button" for="dark-theme"><i class="fa-solid fa-moon fa-sm"></i><p class="btn btn-primary m-2">dark</p></label>
        <label class="theme-label button" for="nature-theme"><i class="fa-solid fa-leaf turn80 fa-sm"></i><p class="btn btn-primary m-2">natture</p></label>
    </div>
</main>
